<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alejandro Rosales Rodriguez</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css?v=top3">
</head>
<body>
  <nav class="site-nav" aria-label="Primary">
    <a class="nav-mark" href="/">Alejandro Rosales Rodriguez</a>
    <ul class="nav-links">
      <li><a href="/story/">Story</a></li>
      <li><a href="/photos/">Photos</a></li>
      <li><a href="/projects/">Projects</a></li>
      <li><a href="/watched/">Watched</a></li>
      <li><a href="/favorite-movies/">Favorite Movies</a></li>
      <li><a href="/reading/" class="is-active" aria-current="page">Reading</a></li>
      <li><a href="/random/">Random</a></li>
    </ul>
  </nav>
  <main class="page page--reading">
    <section class="reading-hero" aria-label="Reading">
      <p class="reading-hero__statement">Always aim to<br>read a lot.</p>
      <figure class="reading-hero__photo">
        <img
          src="/reading/hero.jpg"
          alt="Alejandro reading at a desk"
          width="1200"
          height="1600"
          decoding="async"
          fetchpriority="high"
        >
      </figure>
    </section>
    <section class="reading-top3" aria-label="Top 3">
      <ul class="reading-top3__covers" id="reading-top3"></ul>
      <p class="reading-top3__statement">Top 3.</p>
    </section>
    <ul class="reading-grid" id="reading-grid" aria-label="Books"></ul>
  </main>

  <div class="modal" id="book-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button type="button" class="modal-backdrop" id="modal-backdrop" tabindex="-1" aria-label="Close"></button>
    <div class="modal-panel">
      <button type="button" class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      <h2 class="modal-title" id="modal-title"></h2>
      <p class="modal-year" id="modal-meta"></p>
      <p class="modal-note" id="modal-note" hidden></p>
    </div>
  </div>

  <script src="/js/reading.js?v=top3" defer></script>
</body>
</html>
