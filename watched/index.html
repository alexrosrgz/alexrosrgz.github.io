<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watched — Alejandro Rosales Rodriguez</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css?v=favtab1">
</head>
<body>
    <nav class="site-nav" aria-label="Primary">
      <a class="nav-mark" href="/">AR</a>
      <ul class="nav-links">
        <li><a href="/story/">Story</a></li>
        <li><a href="/photos/">Photos</a></li>
        <li><a href="/projects/">Projects</a></li>
        <li><a href="/watched/" class="is-active" aria-current="page">Watched</a></li>
        <li><a href="/favorite-movies/">Favorite Movies</a></li>
        <li><a href="/random/">Random</a></li>
      </ul>
    </nav>
  <main class="page page--watched">
    <div class="filter-row">
      <nav class="filter-row__cats watch-filter" aria-label="Categories">
        <button type="button" data-filter="all" class="is-active" aria-pressed="true">All</button>
        <button type="button" data-filter="films" aria-pressed="false">Movies</button>
        <button type="button" data-filter="documentaries" aria-pressed="false">Documentaries</button>
        <button type="button" data-filter="standup" aria-pressed="false">Stand Up</button>
        <button type="button" data-filter="series" aria-pressed="false">Series</button>
        <button type="button" data-filter="documentary-series" aria-pressed="false">Documentary series</button>
      </nav>
      <div class="search" data-open="false">
        <button type="button" class="search__toggle" aria-label="Search watched" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20l-3.5-3.5"></path>
          </svg>
        </button>
        <div class="search__field">
          <div class="search__field-inner">
            <input class="search__input" type="search" placeholder="Search" autocomplete="off" enterkeyhint="search" />
            <button type="button" class="search__clear" hidden aria-label="Clear search">&times;</button>
          </div>
        </div>
      </div>
    </div>
    <ul class="poster-grid" id="poster-grid" aria-label="Watch list"></ul>
  </main>

  <div class="modal" id="movie-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button type="button" class="modal-backdrop" id="modal-backdrop" tabindex="-1" aria-label="Close"></button>
    <div class="modal-panel">
      <button type="button" class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      <h2 class="modal-title" id="modal-title"></h2>
      <p class="modal-year" id="modal-year"></p>
      <p class="modal-note" id="modal-note" hidden></p>
    </div>
  </div>

  <script src="/js/watched.js?v=favtab1" defer></script>

</body>
</html>
